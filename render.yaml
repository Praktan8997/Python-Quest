# Render Blueprint Configuration for Python Quest
# Documentation: https://render.com/docs/blueprint-spec
# Deploy all 4 services: DB + Backend + Execution Service + Frontend

services:
  # ─── Backend API ─────────────────────────────────────────────────────────────
  - type: web
    name: python-quest-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DATABASE_URL
        fromDatabase:
          name: python-quest-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: python-quest-frontend
          envVarKey: RENDER_EXTERNAL_URL
      - key: CODE_EXECUTION_URL
        fromService:
          type: web
          name: python-quest-execution
          envVarKey: RENDER_EXTERNAL_URL

  # ─── Code Execution Service ───────────────────────────────────────────────────
  - type: web
    name: python-quest-execution
    runtime: python
    region: singapore
    plan: free
    rootDir: execution-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: ALLOWED_ORIGINS
        fromService:
          type: web
          name: python-quest-backend
          envVarKey: RENDER_EXTERNAL_URL

  # ─── Frontend Static Site ────────────────────────────────────────────────────
  - type: web
    name: python-quest-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: python-quest-backend
          envVarKey: RENDER_EXTERNAL_URL

# ─── PostgreSQL Database ─────────────────────────────────────────────────────
databases:
  - name: python-quest-db
    databaseName: python_quest
    user: python_quest_user
    plan: free
    region: singapore
