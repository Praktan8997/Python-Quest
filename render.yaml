# Render Blueprint Configuration for Python Quest Backend
# Documentation: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: python-quest-backend
    runtime: python
    region: singapore  # Available regions: oregon, frankfurt, ohio, singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: python-quest-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*" # Replace with your deployed frontend URL (e.g. https://your-app.vercel.app)
      - key: CODE_EXECUTION_URL
        value: http://127.0.0.1:8001/run # Update if execution service is deployed separately

databases:
  - name: python-quest-db
    databaseName: python_quest
    user: python_quest_user
    plan: free
    region: singapore
