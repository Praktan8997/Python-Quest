# Render Blueprint Configuration for Python Quest
# Documentation: https://render.com/docs/blueprint-spec
# Deploy all 4 services: DB + Backend + Execution Service + Frontend

services:
  # ─── Backend API ─────────────────────────────────────────────────────────────
  - type: web
    name: python-quest-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DATABASE_URL
        fromDatabase:
          name: python-quest-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        # After frontend deploys, update this to the actual frontend URL
        # e.g. https://python-quest-frontend.onrender.com
        value: "https://python-quest-frontend.onrender.com"
      - key: CODE_EXECUTION_URL
        # Will be updated after execution service is deployed
        # Format: https://python-quest-execution.onrender.com/run
        value: "https://python-quest-execution.onrender.com/run"

  # ─── Code Execution Service ───────────────────────────────────────────────────
  - type: web
    name: python-quest-execution
    runtime: python
    region: singapore
    plan: free
    rootDir: execution-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: ALLOWED_ORIGINS
        # Restrict to backend domain for security
        value: "https://python-quest-backend.onrender.com"

  # ─── Frontend Static Site ────────────────────────────────────────────────────
  - type: web
    name: python-quest-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://python-quest-backend.onrender.com"

# ─── PostgreSQL Database ─────────────────────────────────────────────────────
databases:
  - name: python-quest-db
    databaseName: python_quest
    user: python_quest_user
    plan: free
    region: singapore
